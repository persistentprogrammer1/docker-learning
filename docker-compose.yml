services:
  frontend:
    build: ./frontend
    ports: 
      - 8080:80
    depends_on:
      - backend
  backend:
    build: ./backend
    ports: 
      - 3000:3000
    depends_on:
      - database
  database:
    image: mysql
    environment:
      MYSQL_ROOT_PASSWORD: mypassword
      MYSQL_DATABASE: tododb
      MYSQL_ROOT_HOST: '%'
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:

